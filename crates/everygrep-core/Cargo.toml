[package]
name = "everygrep-core"
description = "Indexing and search engine for EveryGrep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Hashes of file contents (`hash.rs`): CRC-32, MD5 and SHA-256 for the hash
# columns, XXH3-128 to find files with the same contents. crc32fast is the
# version already in Cargo.lock; md-5 and sha2 without their default
# features (no object identifiers); 0.11.0 is the newest sha2 for Rust 1.85.
# twox-hash with only XXH3-128 (its default features bring a random number
# generator).
crc32fast = "1.5.3"
# Searching file contents (`content:`): the line searcher of ripgrep with
# binary detection, BOM sniffing and transcoding (it brings bstr,
# encoding_rs_io and grep-matcher), its regular expression matcher, and
# encoding_rs for the legacy code pages. 0.8.35 is the newest encoding_rs
# for Rust 1.85.
encoding_rs = "0.8.35"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
kamadak-exif = { version = "=0.6.1", default-features = false }
lofty = { version = "=0.25.5", default-features = false, features = ["id3v2_compression_support"] }
md-5 = { version = "0.11.0", default-features = false }
# Regular expressions in queries. The locked version and default features
# add no crates that were not in Cargo.lock already.
regex = "1.13.1"
rawzip = { version = "=0.5.2", default-features = false, features = ["std"] }
quick-xml = { version = "=0.42.0", default-features = false }
# Folders are opened relative to their parent tree without following
# symbolic links (`openat2`, `O_NOFOLLOW`), and read from that descriptor.
# The locked version is already used by other crates of the workspace and
# adds no crates to Cargo.lock.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_128", "std"] }

[lints]
workspace = true
