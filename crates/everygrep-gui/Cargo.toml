[package]
name = "everygrep-gui"
description = "Desktop window for EveryGrep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "everygrep-gui"
path = "src/main.rs"

[dependencies]
everygrep-core = { path = "../everygrep-core" }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-wayland",
    "renderer-femtovg",
    "accessibility",
] }
# The window's raw key events, for shortcuts by key position (see
# src/physical.rs). Already built as part of Slint's winit backend; pinned to
# the version Slint uses, as its API is Slint's own.
i-slint-backend-winit = { version = "=1.18.1", default-features = false }
# Single instance over the session bus. Same version and features as the
# copy Slint already uses for accessibility, so no new crates.
zbus = { version = "5.19", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
# Files on the XWayland clipboard (see src/x11clip.rs). Same version as
# the copy Slint's clipboard already uses, without features, so no new
# crates.
x11rb = { version = "0.13.2", default-features = false }
# Permanent delete walks folders by descriptor and stays on one file system
# (see src/actions.rs). Same version and features as everygrep-core, so no
# new crates.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
# Keeps our windows and the portal's dialogs above the window that opened
# them (see src/wayland_parent.rs), on the Wayland connection winit already
# has. Same versions as the copies winit uses, so no new crates.
wayland-client = { version = "0.31.15", default-features = false, features = ["system"] }
wayland-protocols = { version = "0.32.12", default-features = false, features = [
    "client",
    "unstable",
] }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
