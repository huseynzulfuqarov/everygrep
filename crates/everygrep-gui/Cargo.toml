[package]
name = "everygrep-gui"
description = "Desktop window for EveryGrep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "everygrep-gui"
path = "src/main.rs"

[dependencies]
everygrep-core = { path = "../everygrep-core" }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-wayland",
    "renderer-femtovg",
    "accessibility",
] }
# Single instance over the session bus. Same version and features as the
# copy Slint already uses for accessibility, so no new crates.
zbus = { version = "5.19", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
# Files on the XWayland clipboard (see src/x11clip.rs). Same version as
# the copy Slint's clipboard already uses, without features, so no new
# crates.
x11rb = { version = "0.13.2", default-features = false }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
